<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Currency Converter - IRR/USD/CAD/AED</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0e0f11;--s1:#15171a;--s2:#1c1f23;--bd:rgba(255,255,255,.07);--tx:#f0ede8;--mu:#8a8680;--pr:#4f98a3;--pr2:#76b6bf;--gn:#6daa45;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .container{max-width:600px;width:100%;}
    .card{background:var(--s1);border:1px solid var(--bd);border-radius:1.2rem;padding:2rem;}
    h1{font-size:2rem;font-weight:900;margin-bottom:0.5rem;}
    .subtitle{color:var(--mu);margin-bottom:2rem;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}
    label{font-size:0.75rem;font-weight:600;color:var(--mu);display:block;margin-bottom:0.5rem;}
    select,input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:0.6rem;padding:0.75rem;color:var(--tx);font:inherit;font-size:0.9rem;}
    select:focus,input:focus{outline:none;border-color:var(--pr);}
    .result-box{background:color-mix(in oklab,var(--pr) 12%,var(--s2));border:2px solid var(--pr);border-radius:0.6rem;padding:1.5rem;margin-top:1.5rem;}
    .result-label{font-size:0.8rem;color:var(--mu);margin-bottom:0.5rem;}
    .result-value{font-size:2.5rem;font-weight:900;color:var(--pr);}
    .rate-info{font-size:0.85rem;color:var(--mu);margin-top:0.5rem;}
    .btn{width:100%;background:var(--pr);color:#fff;border:none;padding:1rem;border-radius:0.6rem;font:inherit;font-weight:700;cursor:pointer;margin-top:1.5rem;transition:opacity 0.2s;}
    .btn:hover{opacity:0.85;}
    @media(max-width:600px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>💱 Currency Converter</h1>
      <p class="subtitle">Convert between Iranian Rial, US Dollar, Canadian Dollar, and UAE Dirham</p>
      
      <div class="grid">
        <div>
          <label>From Currency</label>
          <select id="fromCurrency" onchange="calc()">
            <option value="IRR">🇮🇷 Iranian Rial (IRR)</option>
            <option value="USD">🇺🇸 US Dollar (USD)</option>
            <option value="CAD">🇨🇦 Canadian Dollar (CAD)</option>
            <option value="AED">🇦🇪 UAE Dirham (AED)</option>
          </select>
        </div>
        <div>
          <label>To Currency</label>
          <select id="toCurrency" onchange="calc()">
            <option value="USD">🇺🇸 US Dollar (USD)</option>
            <option value="CAD">🇨🇦 Canadian Dollar (CAD)</option>
            <option value="AED">🇦🇪 UAE Dirham (AED)</option>
            <option value="IRR">🇮🇷 Iranian Rial (IRR)</option>
          </select>
        </div>
      </div>
      
      <div>
        <label>Amount</label>
        <input type="number" id="amount" value="1000" oninput="calc()" placeholder="Enter amount">
      </div>
      
      <div class="result-box">
        <div class="result-label">Converted Amount</div>
        <div class="result-value" id="result">0.00</div>
        <div class="rate-info" id="rate">1 IRR = 0.000024 USD</div>
      </div>
      
      <button class="btn" onclick="swap()">🔄 Swap Currencies</button>
    </div>
  </div>
  
  <script>
    const rates = {
      IRR: { USD: 0.000024, CAD: 0.000032, AED: 0.000088, IRR: 1 },
      USD: { IRR: 42000, CAD: 1.35, AED: 3.67, USD: 1 },
      CAD: { IRR: 31100, USD: 0.74, AED: 2.72, CAD: 1 },
      AED: { IRR: 11430, USD: 0.27, CAD: 0.37, AED: 1 }
    };
    
    function calc() {
      const amt = parseFloat(document.getElementById('amount').value) || 0;
      const from = document.getElementById('fromCurrency').value;
      const to = document.getElementById('toCurrency').value;
      const result = amt * rates[from][to];
      document.getElementById('result').textContent = result.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
      document.getElementById('rate').textContent = `1 ${from} = ${rates[from][to].toLocaleString('en-US', {minimumFractionDigits:6, maximumFractionDigits:6})} ${to}`;
    }
    
    function swap() {
      const from = document.getElementById('fromCurrency');
      const to = document.getElementById('toCurrency');
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
      calc();
    }
    
    calc();
  </script>
</body>
</html>
